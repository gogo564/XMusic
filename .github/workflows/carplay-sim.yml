name: CarPlay Simulator Test

on:
  workflow_dispatch:

jobs:
  carplay-sim:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Install XcodeGen
        run: brew install xcodegen 2>&1 | tail -3

      - name: Generate xcodeproj with XcodeGen
        run: xcodegen generate --project . 2>&1

      - name: Build for simulator (Xcode ad-hoc signed)
        run: |
          LOG=$(mktemp)
          # 模拟器目标让 Xcode 自己签名（ad-hoc + 自动嵌入 CODE_SIGN_ENTITLEMENTS），
          # 不要 CODE_SIGNING_ALLOWED=NO —— 那会产出未签名包，simctl launch 会被 SBMainWorkspace 拒绝。
          xcodebuild -project XMusic.xcodeproj -scheme XMusic \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/simdd \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            build 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          gzip "$LOG" && mv "$LOG.gz" /tmp/sim_build_log.gz
          [ $RC -eq 0 ] || exit $RC

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sim-Build-Log
          path: /tmp/sim_build_log.gz

      - name: Boot simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE '[A-F0-9-]{36}')
          echo "Device UDID: $DEVICE"
          echo "$DEVICE" > /tmp/device_udid
          xcrun simctl boot "$DEVICE" 2>&1 || true
          xcrun simctl bootstatus "$DEVICE" -b 2>&1 | tail -2
          echo "Booted."

      - name: Install app
        run: |
          DEVICE=$(cat /tmp/device_udid)
          APP=$(find /tmp/simdd/Build/Products -name "XMusic.app" -type d | head -1)
          echo "App: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: no .app found"
            exit 1
          fi
          # 模拟器构建保持 Xcode 签名（CODE_SIGNING_ALLOWED=NO 时用 ad-hoc）。
          # 注意：不在模拟器上用 ldid 重签——ldid 签名会让模拟器拒绝启动（SBMainWorkspace）。
          xcrun simctl install "$DEVICE" "$APP"
          echo "Installed."
          # 验证模拟器 app 是否真的嵌入了 CarPlay entitlement（图标能否出现在 CarPlay 主屏的关键）
          APP_BIN="$APP/XMusic"
          echo "=== CarPlay entitlement check ==="
          if command -v codesign >/dev/null 2>&1 && [ -f "$APP_BIN" ]; then
            codesign -d --entitlements :- "$APP_BIN" 2>/dev/null | grep -iE "carplay" || echo "NO carplay entitlement in signed binary!"
          fi
          # 备选：直接查 .xcent（Xcode 模拟器签名产物）
          find "$APP" -name "*xcent*" -exec sh -c 'echo "--- {} ---"; cat "$1"' _ {} \; 2>/dev/null | grep -iE "carplay|entitlement|<dict" | head || true

      - name: Enable CarPlay and open external display
        run: |
          defaults write com.apple.iphonesimulator CarPlay -bool YES
          defaults write com.apple.iphonesimulator CarPlayExtraOptions -bool YES
          open -a Simulator 2>&1
          sleep 12
          echo "=== Simulator menu tree (diagnostic) ==="
          osascript -e '
            tell application "Simulator" to activate
            delay 1
            tell application "System Events"
              tell process "Simulator"
                set out to ""
                repeat with mb in menu bar items of menu bar 1
                  set out to out & "MENUBARITEM: " & (name of mb) & linefeed
                  try
                    repeat with mi in menu items of menu 1 of mb
                      set out to out & "  ITEM: " & (name of mi) & linefeed
                      try
                        set out to out & "    has submenu: " & ((count of menu items of menu 1 of mi) > 0) & linefeed
                        repeat with mi2 in menu items of menu 1 of mi
                          set out to out & "      SUB: " & (name of mi2) & linefeed
                        end repeat
                      end try
                    end repeat
                  end try
                end repeat
                return out
              end tell
            end tell' 2>&1 | tee /tmp/menu_tree.txt
          echo "=== end menu tree ==="

          # 动态查找 CarPlay 菜单项并点击（菜单树诊断确认：I/O > External Displays > CarPlay…，注意省略号）
          for script in \
            'click menu item "CarPlay…" of menu 1 of menu item "External Displays" of menu 1 of menu bar item "I/O" of menu bar 1' \
            'click menu item "CarPlay" of menu 1 of menu item "External Displays" of menu 1 of menu bar item "I/O" of menu bar 1' \
            'click menu item "CarPlay…" of menu 1 of menu item "External Displays" of menu 1 of menu bar item "Hardware" of menu bar 1' \
            'click menu item "External Displays" of menu 1 of menu bar item "I/O" of menu bar 1'; do
            osascript -e "tell application \"System Events\" to tell process \"Simulator\" to try
            $script
            end try" 2>&1 | grep -v "^$" || true
            sleep 1
          done
          echo "CarPlay click attempts done."
          sleep 3
          # TV Out Extended Setup 配置面板出现：底部有 Load/Save/Run 三个按钮。
          # 必须点 Run 才会应用外接显示并进入 CarPlay。优先用按钮名点击（辅助功能可用），失败则坐标兜底。
          echo "=== Clicking Run button on TV Out Extended Setup panel ==="
          osascript -e '
            tell application "System Events" to tell process "Simulator"
              set clickedRun to false
              repeat with w in windows
                try
                  repeat with b in buttons of w
                    if name of b is "Run" then
                      click b
                      set clickedRun to true
                      return "Clicked Run button by name"
                    end if
                  end repeat
                end try
              end repeat
              return "Run button not found by name: " & clickedRun
            end tell' 2>&1 || true
          sleep 4
          echo "=== Windows after clicking Run ==="
          xcrun swiftc -o /tmp/winenum scripts/window_enum.swift 2>&1 | tail -2 || true
          /tmp/winenum 2>&1 | tee /tmp/sim_windows.txt
          echo "=== end windows ==="

      - name: Launch app and wait
        run: |
          DEVICE=$(cat /tmp/device_udid)
          # 等 SpringBoard 完全就绪再启动，避免 SBMainWorkspace 拒绝
          xcrun simctl bootstatus "$DEVICE" -b 2>&1 | tail -1
          sleep 3
          xcrun simctl install "$DEVICE" "$(find /tmp/simdd/Build/Products -name XMusic.app -type d | head -1)" 2>&1 || true
          # 前台启动（-f 强制前台），并打印返回码
          xcrun simctl launch --terminate-running-process "$DEVICE" xmusic.XMusic 2>&1 || echo "LAUNCH_RC=$?"
          sleep 15

      - name: Phone screen - scroll to bottom and tap Test-Connection login
        run: |
          DEVICE=$(cat /tmp/device_udid)
          # 编译滚动 + 点击工具
          xcrun swiftc -o /tmp/window_scroll scripts/window_scroll.swift 2>&1 | tail -2 || true
          xcrun swiftc -o /tmp/window_click scripts/window_click.swift 2>&1 | tail -2 || true
          ls -la /tmp/window_scroll /tmp/window_click 2>&1 || true

          # 配置页在手机窗口（竖屏，用户确认按钮坐标 ~500,538）。
          # 列表较长，需先滚动到底部让“测试连接并登录”可见。
          # 手机窗口中心约 (512, 330)；在其上滚动 6 次。
          for i in 1 2 3 4 5 6; do
            /tmp/window_scroll 512 330 -20 2>&1 | tail -1
            sleep 1
          done

          # 点“测试连接并登录”（用户确认坐标 ~500,538）
          /tmp/window_click 500 538 2>&1 | tail -1
          # 再留时间等 login + 歌单刷新
          sleep 20

          # 验证登录：token 是否写入
          echo "=== login token check ==="
          xcrun simctl spawn "$DEVICE" defaults read xmusic.XMusic userToken 2>&1 | head -c 120 || echo "NO TOKEN"
          echo ""

      - name: Click XMusic icon on CarPlay home screen
        run: |
          CONTAINER=$(xcrun simctl get_app_container "$(cat /tmp/device_udid)" xmusic.XMusic data 2>/dev/null || true)
          LOGFILE="$CONTAINER/Documents/xmusic.log"
          echo "LOGFILE=$LOGFILE"
          # 先清空日志基线，方便精确判断 didConnect 是否出现
          : > "$LOGFILE" 2>/dev/null || true

          # 重新枚举窗口（不依赖前置步骤的旧列表，窗口可能已变）
          echo "=== candidate windows ==="
          /tmp/winenum > /tmp/sim_windows.txt 2>/dev/null || true
          cat /tmp/sim_windows.txt

          # 编译 CGEvent 点击工具（无需辅助功能权限，比 System Events click at 可靠）
          xcrun swiftc -o /tmp/window_click scripts/window_click.swift 2>&1 | tail -2 || true
          # 准备 park 脚本（移动手机窗口 + AXRaise CarPlay）
          cp scripts/park.sh /tmp/park.sh 2>&1 && chmod +x /tmp/park.sh
          xcrun swiftc -o /tmp/winenum scripts/window_enum.swift 2>&1 | tail -2 || true

          # 在 CarPlay 主屏上点击 XMusic 图标（用户确认：左下第一格，4列x2行）。
          # CarPlay 窗口是宽屏（宽高比 ~1.5），手机窗口是竖屏（~0.45）——用宽高比识别。
          # 坐标用整数百分比系数（bash $(( )) 不支持浮点）：fx/fy 为整数 0~100。
          found=0
          trypoint() {
            cx=$1; cy=$2
            /tmp/window_click "$cx" "$cy" 2>&1 | tail -1
            sleep 2
            if grep -q "didConnect" "$LOGFILE" 2>/dev/null; then
              echo "SUCCESS: didConnect detected after click at ($cx,$cy)"
              found=1
            fi
          }
          while IFS='|' read -r _name _layer _id pos dims; do
            [ "$found" = "1" ] && break
            pos=$(echo "$pos" | cut -d= -f2)
            x=$(echo "$pos" | cut -d, -f1); y=$(echo "$pos" | cut -d, -f2)
            w=$(echo "$dims" | cut -d, -f1); h=$(echo "$dims" | cut -d, -f2)
            w=${w%$'\r'}; h=${h%$'\r'}
            [ "$w" -lt 200 ] 2>/dev/null && continue
            [ "$h" -lt 150 ] 2>/dev/null && continue
            layer=$(echo "$_layer" | cut -d= -f2)
            [ "$layer" != "0" ] && continue
            # 优先 CarPlay 宽屏窗口（宽高比 ≥ 1.0）
            aspect=$(awk "BEGIN{printf \"%.2f\", $w/$h}")
            echo "window dims=$w x $h aspect=$aspect pos=$pos"
            isCarPlay=0
            awk "BEGIN{exit !($aspect >= 1.0)}" && isCarPlay=1
            if [ "$isCarPlay" = "1" ]; then
              echo "  -> CarPlay window found at $pos (${w}x${h}). Parking phone & raising CarPlay."
              /tmp/park.sh "$x" "$y" "$w" "$h" 2>&1 | tail -2
              sleep 2
              # 重新枚举窗口：读取移动后的最新位置
              echo "=== windows after park (live) ==="
              /tmp/winenum > /tmp/sim_windows2.txt 2>/dev/null || true
              cat /tmp/sim_windows2.txt
              newx=; newy=
              while IFS='|' read -r n2 l2 i2 p2 d2; do
                px=$(echo "$p2" | cut -d= -f2 | cut -d, -f1); py=$(echo "$p2" | cut -d= -f2 | cut -d, -f2)
                w2=$(echo "$d2" | cut -d, -f1 | tr -d '\r'); h2=$(echo "$d2" | cut -d, -f2 | tr -d '\r')
                [ "$w2" -lt 200 ] 2>/dev/null && continue
                [ "$h2" -lt 150 ] 2>/dev/null && continue
                [ "$(echo "$l2" | cut -d= -f2)" != "0" ] && continue
                a2=$(awk "BEGIN{printf \"%.2f\", $w2/$h2}")
                if awk "BEGIN{exit !($a2 >= 1.0)}"; then
                  newx=$px; newy=$py; neww=$w2; newh=$h2
                  break
                fi
              done < /tmp/sim_windows2.txt
              # 若移动后 CarPlay 仍定位，用新坐标；否则退回旧 x,y
              echo "  -> live CarPlay pos: ${newx:-$x},${newy:-$y}"
              cxp=${newx:-$x}; cyp=${newy:-$y}; cw=${neww:-$w}; ch=${newh:-$h}
              # AX 精确读取 CarPlay 窗口内的按钮/图标坐标（避免盲猜像素）
              xcrun swiftc -o /tmp/ax_elements scripts/ax_elements.swift 2>&1 | tail -2 || true
              echo "=== AX elements in Simulator (CarPlay window) ==="
              /tmp/ax_elements Simulator 2>&1 | grep -E "role=AXButton|role=AXImage|pos=" | head -40 || true
              echo "=== end AX ==="
              # 首选：CarPlay 窗口内相对坐标（用户之前确认图标=左下第一格，中心约 18%,75%）
              echo "  -> First clicking XMusic at relative center (18%,75%) => $((cxp + cw*18/100)),$((cyp + ch*75/100))"
              trypoint $((cxp + cw*18/100)) $((cyp + ch*75/100))
              # 邻近兜底
              [ "$found" = "1" ] && continue
              for dx in -14 14; do
                for dy in -14 14; do
                  trypoint $((cxp + cw*18/100 + dx)) $((cyp + ch*75/100 + dy))
                  [ "$found" = "1" ] && break 2
                done
              done
              # 保留用户确认的绝对坐标 (440,255) 作兜底（若手机窗口从未移动，此值仍对准）
              [ "$found" = "1" ] && continue
              trypoint 440 255
              # 4x2 全格扫描
              [ "$found" = "1" ] && continue
              for fy in 25 75; do
                for fx in 12 38 63 88; do
                  trypoint $(( cxp + cw * fx / 100 )) $(( cyp + ch * fy / 100 ))
                  [ "$found" = "1" ] && break 2
                done
              done
              # 兜底：更密的网格
              [ "$found" = "1" ] && continue
              for fy in 15 35 55 75 90; do
                for fx in 8 25 42 58 75 92; do
                  trypoint $(( cxp + cw * fx / 100 )) $(( cyp + ch * fy / 100 ))
                  [ "$found" = "1" ] && break 2
                done
              done
            else
              # 手机竖屏窗口也兜底试一次
              trypoint $(( x + w * 18 / 100 )) $(( y + h * 75 / 100 ))
            fi
          done < /tmp/sim_windows.txt
          [ "$found" = "1" ] || echo "WARN: didConnect not detected after grid scan"

      - name: Screenshot CarPlay window
        run: |
          mkdir -p /tmp/artifacts
          DEVICE=$(cat /tmp/device_udid)
          # 主屏截图
          xcrun simctl io "$DEVICE" screenshot /tmp/artifacts/main_screen.png 2>&1 || echo "main screenshot failed"
          # 整屏截图（含 CarPlay 窗口）
          screencapture -x /tmp/artifacts/full_screen.png 2>&1 || echo "screencapture failed"
          ls -la /tmp/artifacts/
          # 应用沙盒日志（Log.write 专用通道，比 unified log 可靠）
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" xmusic.XMusic data 2>/dev/null || true)
          echo "Container: $CONTAINER"
          if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/xmusic.log" ]; then
            cp "$CONTAINER/Documents/xmusic.log" /tmp/artifacts/xmusic.log
            echo "=== xmusic.log ==="
            cat /tmp/artifacts/xmusic.log
          else
            echo "No xmusic.log found; grabbing unified log instead"
          fi
          # 统一日志（CarPlay 框架 + XMusic 进程全输出）
          xcrun simctl spawn "$DEVICE" log show --last 3m --predicate 'process == "XMusic" OR subsystem == "com.apple.CarPlay" OR subsystem CONTAINS "carkit" OR eventMessage CONTAINS "CarPlay"' 2>/dev/null | tail -200 > /tmp/artifacts/unified_log.txt || true
          # 崩溃报告
          mkdir -p /tmp/artifacts/crashes
          cp -R "$HOME/Library/Logs/DiagnosticReports/"*XMusic* /tmp/artifacts/crashes/ 2>/dev/null || true
          ls -la /tmp/artifacts/crashes/ 2>/dev/null || true
          # 菜单树诊断（拿到真实路径）
          cp /tmp/menu_tree.txt /tmp/artifacts/menu_tree.txt 2>/dev/null || true
          # 窗口列表诊断
          cp /tmp/sim_windows.txt /tmp/artifacts/sim_windows.txt 2>/dev/null || true
          # 已安装 app 列表（确认 bundle id 与场景注册）
          xcrun simctl listapps "$DEVICE" 2>/dev/null | grep -A5 -i xmusic || echo "no xmusic in listapps"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarPlay-Sim-Result
          path: /tmp/artifacts/**/*