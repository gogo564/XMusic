name: CarPlay Test

on:
  push:
    branches: [main]

jobs:
  carplay-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Run CarPlay test
        run: |
          chmod +x scripts/carplay_test.sh
          scripts/carplay_test.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarPlay-Test-Result
          path: /tmp/artifacts/**/*
